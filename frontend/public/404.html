<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>frontend</title>
    <script>
      // Redirect SPA deep links through query parameter so GitHub Pages
      // serves index.html instead of a 404. segmentCount = 1 for a project
      // page (one path segment in the base URL, e.g. /soulmaking-companion/).
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.host +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
